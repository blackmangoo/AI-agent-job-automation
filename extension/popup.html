<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #0f0c1b;
      --panel-bg: rgba(30, 27, 57, 0.4);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f0ff;
      --text-sub: #9e95c5;
      --primary: linear-gradient(135deg, #7928ca, #ff0080);
      --secondary: linear-gradient(135deg, #00f2fe, #4facfe);
      --success: #00f5a0;
      --danger: #ff3838;
      --font: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font);
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* Glassmorphism card */
    .dashboard {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      background: var(--primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
      box-shadow: 0 0 8px #777;
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .status-dot.offline {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, 0.04);
      transform: translateY(-2px);
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--secondary);
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }

    .btn-secondary:hover {
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #333;
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .settings-group {
      margin-bottom: 20px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .settings-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-sub);
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-label {
      font-size: 13px;
      color: var(--text-main);
    }

    /* Switch styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      transition: .4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, #00f5a0, #00d9f5);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .log-panel {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .log-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .clear-logs {
      font-size: 11px;
      color: var(--text-sub);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .clear-logs:hover {
      color: #fff;
      text-decoration: underline;
    }

    .terminal {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      height: 120px;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      overflow-y: auto;
      color: #a5d6ff;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header>
      <div class="title" style="display:flex; align-items:center; gap:8px;">
        <img src="icons/icon32.png" alt="Logo" width="22" height="22" style="border-radius:5px;">
        <span>Indeed Apply Agent</span>
      </div>
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Checking Backend</span>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statsScanned">0</div>
        <div class="stat-label">Scanned</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statsApplied">0</div>
        <div class="stat-label">Applied</div>
      </div>
    </div>

    <div class="btn-container">
      <button id="btnStart" class="btn btn-primary" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Start Bot
      </button>
      <button id="btnStop" class="btn btn-secondary" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        Stop Bot
      </button>
    </div>

    <div class="settings-group">
      <div class="settings-title">Configuration</div>
      
      <div class="setting-item">
        <span class="setting-label">Dry Run (No Submit)</span>
        <label class="switch">
          <input type="checkbox" id="settingDryRun" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <span class="setting-label">Skip Ineligible Jobs</span>
        <label class="switch">
          <input type="checkbox" id="settingSkipIneligible" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="log-panel">
      <div class="log-header">
        <div class="log-title">Live Log</div>
        <button id="btnClearLogs" class="clear-logs">Clear</button>
      </div>
      <div id="terminal" class="terminal">Extension initialized. Ready.</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
